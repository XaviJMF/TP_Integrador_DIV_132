<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="scripts/index.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <title>Bienvenida</title>
</head>
<body>
    <header class="header">
        <section class="logo-sect">
            <img src="img/favicon.png" alt="" class="icon-img">
            <h1 id="title-store">PERCHA</h1>
        </section>
        <div class="navbar">
            <div class="nav-position-active">
                <span>1</span> 
                <a href="welcome.html">Bienvenida</a>
            </div>
            <div class="nav-position">
                <span>2</span>
                <p>Menú</p>
            </div>
            <div class="nav-position">
                <span>3</span>
                <p>Carrito</p>
            </div>
            <div class="nav-position">
                <span>4</span>
                <p>Ticket</p>
            </div>
            <button type="button" id="btn-theme">Modo oscuro</button>
        </div>
        <a href="/login" id="btn-admin-panel">Administración ↗</a>
    </header>
    <main class="main">
        <section class="welcome-form">
            <p class="welcome-eyebrow">ROPA ADAPTADA A TU GUSTO.</p>
            <h1 class="welcome-title">Registra tu pedido aquí</h1>
            <p class="welcome-subtitle">Elegí lo que te gusta </p>

        <form id="welcome-form" class="welcome-fields" action="menu.html">
            <div class="welcome-field">
                <input type="text" id="input-name" class="input-name" placeholder="Ingresá tu nombre" required pattern=".*\S.*">
            </div>
            <button type="submit" id="btn-menu">
                <span>Ver el menú</span>
                <span>→</span>
            </button>
        </form>
        </section>

        <section class="welcome-media">
            <div class="background-welcome">
                <span class="welcome-badge">HECHO AL MOMENTO</span>
                <img src="img/welcome-img.jpg" alt="Imagen de bienvenida" class="welcome-img">
            </div>
        </section>
    </main>
    <footer>
        <p>Div 132 - Agustin Mastrocola | Javier Moya</p>
    </footer>
</body>
</html>
