<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="js/index.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <title>Bienvenida</title>
</head>
<body>
    <header class="header">
        <h1 id="title-store">miga.</h1>
        <div class="navbar">
            <div class="nav-position-active">
                <span>1</span> 
                <a href="welcome.html">Bienvenida</a>
            </div>
            <div class="nav-position">
                <span>2</span>
                <p>Menú</p>
            </div>
            <div class="nav-position">
                <span>3</span>
                <p>Carrito</p>
            </div>
            <div class="nav-position">
                <span>4</span>
                <p>Ticket</p>
            </div>
        </div>
        <button id="btn-admin-panel">Administración ↗</button>
    </header>
    <main class="main">
        <section class="welcome-form">
            <p class="welcome-eyebrow">BUENA COMIDA. A TU RITMO.</p>
            <h1 class="welcome-title">Registra tu pedido aquí</h1>
            <p class="welcome-subtitle">Elegí lo que te gusta. Nosotros lo preparamos.</p>

            <div class="welcome-field">
                <label for="input-name" class="welcome-label">Primero, ¿cómo te llamás?</label>
                <input type="text" id="input-name" class="input-name" placeholder="Ingresá tu nombre" required>
                <span class="welcome-hint">Te llamaremos cuando tu pedido esté listo.</span>
            </div>

            <button type="button" id="btn-menu">
                <span>Ver el menú</span>
                <span>→</span>
            </button>

            <p class="welcome-footnote">Elegí. Confirmá. Disfrutá.</p>
        </section>

        <section class="welcome-media">
            <div class="background-welcome">
                <span class="welcome-badge">HECHO AL MOMENTO</span>
                <img src="img/welcome-img.jpg" alt="Imagen de bienvenida" class="welcome-img">
            </div>
        </section>
    </main>
    <footer>
        <p>Div 132 - Agustin Mastrocola | Javier Moya</p>
    </footer>
</body>
</html>
