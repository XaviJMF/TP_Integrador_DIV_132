<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="scripts/index.js"></script>
    <script src="https://unpkg.com/jspdf@latest/dist/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <title>Ticket</title>
</head>
<body> 
    <header class="header">
        <section class="logo-sect">
            <img src="img/favicon.png" alt="" class="icon-img">
            <h1 id="title-store">PERCHA</h1>
        </section>
        <div class="navbar">
            <div class="nav-position">
                <span>1</span>
                <p>Bienvenida</p>
            </div>
            <div class="nav-position">
                <span>2</span>
                <p>Menú</p>
            </div>
            <div class="nav-position">
                <span>3</span>
                <p>Carrito</p>
            </div>
            <div class="nav-position-active">
                <span>4</span>
                <a>Ticket</a>
            </div>
        </div>
            <button type="button" id="btn-theme">Modo oscuro</button>
    </header>
    <main class="main">
            <div class="left-ticket-view">
                <div class="icon-img" id="ticket-img">
                    <img src="img/check.svg" alt="" class="img-ticket-view">
                </div>
                <div class="view-msg">
                    <h1 id="user-greetings"></h1>
                    <h2>Tu pedido ya está<br>en buenas manos.</h2>
                </div>
                <div class="btns-section">
                    <button class="btn-finish">Hacer otro pedido →</button>
                    <button class="btn-download">￬ Descargar ticket</button>
                </div>
            </div>
            <div>
                <div class="modal-ticket">
                    <div class="ticket-top">
                        <div>
                            <h1>PERCHA</h1>
                            <p>Ticket de pedido</p>
                        </div>
                        <div id="confirmed-block">Confirmado</div>
                    </div>
                    <div class="ticket-mid">
                        <h1 id="id-ticket"></h1>
                        <p id="user-ticket"></p>
                        <p id="datetime-ticket">13 nov 2026 12:30 - Local Centro</p>
                    </div>
                    <div class="ticket-info">
                        <p id="">Detalle:</p>
                        <ul id="list" class="user-cart">
                        </ul>
                    </div>
                    <div class="ticket-bottom">
                        <p id="text-total">Total</p>
                        <h1 id="price"></h1>
                    </div>
                </div>
            </div>
    </main>
    <footer>
        <p>Div 132 - Agustin Mastrocola | Javier Moya</p>
    </footer>
</body>
</html>
